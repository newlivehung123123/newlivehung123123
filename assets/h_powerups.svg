<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" shape-rendering="crispEdges" role="img" aria-label="Power-Ups"><style>
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(1140px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s steps(6) infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.bob,.spin,.blink{animation:none}}
